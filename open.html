<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公開シート</title>
<!-- 公開シート（OPEN SCRIPT）を URL の ?o= だけから描く。脚本・サーバーには問い合わせない。
     ?o= に入るのは公開シートの項目だけ（惨劇セット・ループ回数・日数・相談・特殊ルール・事件の日と名前）で、犯人・ルール・配役は入らない。
     書式は主人公の書 印刷p47（wiki/concepts/script-sheets.md）。元のシートの画像は使わず、同じ構成を HTML と CSS で描く -->
<style>
:root { --ink: #1a1a1a; --mut: #666; --paper: #fff; --line: #222; --soft: #e9e9e9; }
* { box-sizing: border-box; }
body { margin: 0; background: #8a8a8a; color: var(--ink); font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Times New Roman", serif;
  padding-block: 16px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.sheet { max-width: 640px; margin: 0 auto; background: var(--paper); padding: 22px 26px 30px; border: 1px solid #555; box-shadow: 0 2px 12px rgba(0,0,0,.35); position: relative; }
.sheet::before, .sheet::after { content: ''; position: absolute; top: 10px; bottom: 10px; width: 6px; border: 2px solid #999; border-radius: 2px; }
.sheet::before { left: 8px; border-right: none; } .sheet::after { right: 8px; border-left: none; }
h1 { margin: 0; text-align: center; font-size: 34px; letter-spacing: .12em; }
.en { text-align: center; font-size: 12px; letter-spacing: .3em; color: var(--mut); margin: 2px 0 14px; }
.en::before, .en::after { content: '〜 ❦ 〜'; margin: 0 .8em; letter-spacing: 0; color: #999; }
.field { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--line); padding: 6px 2px; margin-bottom: 6px; }
.lbl { font-weight: 700; white-space: nowrap; font-size: 15px; }
.val { flex: 1; font-size: 18px; min-width: 0; overflow-wrap: anywhere; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.badge { display: inline-block; background: #333; color: #fff; border-radius: 3px; padding: 1px 8px; font-size: 13px; letter-spacing: .05em; }
.consult { display: flex; gap: 28px; align-items: baseline; }
.consult span { padding: 0 12px; border-radius: 50%; }
.consult span.on { border: 2px solid var(--ink); }
.consult span.off { color: #aaa; text-decoration: line-through; }
.frame { margin: 18px 4px; border: 3px double var(--line); padding: 30px 18px 18px; position: relative; min-height: 140px; }
.frame .ttl { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: var(--paper); padding: 0 14px; font-size: 18px; font-weight: 700; letter-spacing: .3em; white-space: nowrap; }
.frame .ttl::before, .frame .ttl::after { content: '❧'; color: #777; margin: 0 .5em; }
.frame .corner { position: absolute; font-size: 20px; color: #555; line-height: 1; }
.frame .c1 { top: 2px; left: 4px; } .frame .c2 { top: 2px; right: 4px; transform: scaleX(-1); } .frame .c3 { bottom: 2px; left: 4px; transform: scaleY(-1); } .frame .c4 { bottom: 2px; right: 4px; transform: scale(-1); }
.frame .txt { white-space: pre-wrap; font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
.frame .txt.none { color: #aaa; text-align: center; }
.sched { margin-top: 10px; }
.sched .head { text-align: center; font-size: 22px; letter-spacing: .25em; color: #bbb; font-style: italic; margin-bottom: 4px; }
.sched .head b { font-style: normal; color: var(--ink); font-size: 15px; letter-spacing: .1em; margin-left: .5em; }
table { width: 100%; border-collapse: collapse; border: 2px solid var(--line); }
th { background: #111; color: #fff; padding: 6px 4px; font-size: 18px; letter-spacing: .2em; }
th.sp { font-size: 10px; letter-spacing: 0; width: 3.4em; line-height: 1.2; }
td { border: 1px solid var(--line); padding: 6px 10px; font-size: 17px; height: 2.1em; }
td.day { width: 3.6em; text-align: center; font-weight: 700; font-size: 19px; }
td.sp { text-align: center; } td.sp i { display: inline-block; width: 1.1em; height: 1.1em; border: 1.5px solid #555; vertical-align: middle; }
tr:nth-child(even) td { background: #fafafa; }
.note { max-width: 640px; margin: 10px auto 0; color: #fff; font-family: system-ui, sans-serif; font-size: 12px; text-align: center; }
.err { max-width: 640px; margin: 40px auto; background: #fff; padding: 20px; font-family: system-ui, sans-serif; }
@media print { body { background: #fff; padding: 0; } .sheet { box-shadow: none; border: none; } .note { display: none; } }
@media (max-width: 420px) { .sheet { padding: 18px 14px 24px; } h1 { font-size: 28px; } .pair { grid-template-columns: 1fr; } td { padding: 5px 6px; font-size: 15px; } }
</style>
</head>
<body>
<div id="out"></div>
<p class="note">この公開シートの URL には、犯人・ルール・役職は入っていません。</p>
<script>
// ?o= の形: base64url(deflate-raw(JSON))。JSON: {v:1, s:惨劇セット, l:ループ回数, d:1ループ日数, c:相談可(1/0), sp:特殊ルール, i:[[日, 事件の名前], …]}
async function decode(code) {
  const b = Uint8Array.from(atob(code.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const s = new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(s).text());
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; };
function render(o) {
  const str = (x, n) => typeof x === 'string' ? x.slice(0, n) : '';
  const num = x => Number.isInteger(x) && x > 0 && x < 100 ? x : '';
  const sheet = el('div', 'sheet');
  sheet.append(el('h1', '', '公開シート'), el('div', 'en', 'OPEN SCRIPT'));
  const f = (label, value) => { const d = el('div', 'field'); d.append(el('span', 'lbl', label), el('span', 'val', value)); return d; };
  sheet.append(f('惨劇セット', str(o.s, 60)));
  const pair = el('div', 'pair'); pair.append(f('ループ回数', num(o.l)), f('1ループ日数', num(o.d))); sheet.append(pair);
  const c = el('div', 'field'); c.append(el('span', 'lbl', '相談'));
  const cs = el('span', 'val consult'); cs.append(el('span', o.c === 0 ? 'off' : 'on', '可'), el('span', o.c === 0 ? 'on' : 'off', '不可')); c.append(cs); sheet.append(c);
  const fr = el('div', 'frame'); fr.append(el('span', 'ttl', '特殊ルール'));
  for (const k of ['c1', 'c2', 'c3', 'c4']) fr.append(el('span', 'corner ' + k, '❦'));
  const sp = str(o.sp, 500).trim(); fr.append(el('div', 'txt' + (sp ? '' : ' none'), sp || 'なし')); sheet.append(fr);
  const sc = el('div', 'sched'); const h = el('div', 'head', 'Schedule'); h.append(el('b', '', '事件予定')); sc.append(h);
  const t = el('table'), hr = el('tr'); hr.append(el('th', '', '日付'), el('th', 'sp', '特殊\n事件'), el('th', '', '事件予定')); t.append(hr);
  const by = {}; for (const x of Array.isArray(o.i) ? o.i : []) if (Array.isArray(x) && num(x[0])) by[x[0]] = str(x[1], 30);
  for (let d = 1; d <= 10; d++) {
    const r = el('tr'); const s2 = el('td', 'sp'); s2.append(el('i')); r.append(el('td', 'day', d), s2, el('td', '', by[d] || '')); t.append(r);
  }
  sc.append(t); sheet.append(sc);
  document.getElementById('out').replaceChildren(sheet);
}
(async () => {
  const code = new URLSearchParams(location.search).get('o');
  try { if (!code) throw new Error('公開シートの URL ではありません（?o= がない）'); render(await decode(code)); }
  catch (e) { document.getElementById('out').replaceChildren(el('div', 'err', '公開シートを読めませんでした: ' + e.message)); }
})();
</script>
</body>
</html>
